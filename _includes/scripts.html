<script src="{{ '/assets/js/main.min.js' | relative_url }}"></script>

{% include analytics.html %}
{% include fetch_google_scholar_stats.html %}

<style>
/* 头像和论文缩略图使用普通鼠标指针。 */
.author__avatar a,
.author__avatar img,
.paper-box-image a,
.paper-box-image img,
.mfp-zoom {
  cursor: default !important;
}

/* 覆盖插件自带的放大镜指针，包括弹窗背景。 */
body.mfp-zoom-out-cur,
.mfp-wrap,
.mfp-wrap .mfp-container,
.mfp-wrap .mfp-content,
.mfp-wrap .mfp-figure,
.mfp-wrap .mfp-img {
  cursor: default !important;
}

/* 关闭按钮和切换按钮使用手形指针。 */
.mfp-wrap .mfp-close,
.mfp-wrap .mfp-arrow {
  cursor: pointer !important;
}

/* 大图缩放样式。 */
.mfp-img {
  transform-origin: center;
  transition: transform 0.08s linear;
}

.mfp-wrap {
  overflow: hidden !important;
}
</style>

<script>
$(function () {
  var scale = 1;

  function resetImageZoom() {
    scale = 1;
    $(".mfp-img").css("transform", "");
  }

  // 为头像和论文图片链接启用大图预览。
  $(".author__avatar a, .paper-box-image a")
    .filter(function () {
      return $(this).find("img").length > 0;
    })
    .addClass("image-popup");

  // 更新主题原有的图片弹窗配置。
  $(".image-popup").magnificPopup({
    type: "image",
    closeOnContentClick: false,
    closeOnBgClick: true,
    enableEscapeKey: true,

    gallery: {
      enabled: true,
      navigateByImgClick: false,
      preload: [0, 1]
    },

    callbacks: {
      open: resetImageZoom,
      change: resetImageZoom,
      close: resetImageZoom
    }
  });

  // 阻止主题在单击大图时切换图片或关闭弹窗。
  // 保留双击恢复和左右箭头切换功能。
  document.addEventListener("click", function (event) {
    if (!event.target.closest(".mfp-img")) return;

    event.preventDefault();
    event.stopImmediatePropagation();
  }, true);

  // 在大图上滚动鼠标滚轮进行缩放。
  document.addEventListener("wheel", function (event) {
    var image = event.target.closest(".mfp-img");
    if (!image) return;

    event.preventDefault();

    scale *= Math.exp(-event.deltaY * 0.0015);
    scale = Math.max(0.5, Math.min(6, scale));

    image.style.transform = "scale(" + scale + ")";
  }, { passive: false });

  // 双击大图恢复初始比例。
  $(document).on("dblclick", ".mfp-img", function (event) {
    event.preventDefault();
    event.stopPropagation();
    resetImageZoom();
  });
});
</script>
