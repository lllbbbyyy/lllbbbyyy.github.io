<script src="{{ '/assets/js/main.min.js' | relative_url }}"></script>

{% include analytics.html %}
{% include fetch_google_scholar_stats.html %}

<style>
/* 头像和论文缩略图显示手形指针。 */
.author__avatar a.image-popup,
.author__avatar a.image-popup img,
.paper-box-image a.image-popup,
.paper-box-image a.image-popup img,
.image-popup.mfp-zoom {
  cursor: pointer !important;
}

/* 预览背景和大图使用普通指针，取消放大镜。 */
body.mfp-zoom-out-cur,
.mfp-wrap,
.mfp-wrap .mfp-container,
.mfp-wrap .mfp-content,
.mfp-wrap .mfp-figure,
.mfp-wrap .mfp-img {
  cursor: default !important;
}

/* 关闭按钮和切换按钮使用手形指针。 */
.mfp-wrap .mfp-close,
.mfp-wrap .mfp-arrow {
  cursor: pointer !important;
}

/* 鼠标操作后不显示主题的黄色焦点框。 */
a.image-popup:focus:not(:focus-visible) {
  outline: none !important;
  box-shadow: none !important;
}

/* 键盘操作时保留清晰的焦点提示。 */
a.image-popup:focus-visible {
  outline: 2px solid #3172b4 !important;
  outline-offset: 3px;
}

/* 移除插件固定大小的灰色背景和阴影。 */
.mfp-wrap .mfp-figure::after {
  display: none !important;
}

/* 大图缩放。 */
.mfp-wrap img.mfp-img {
  background: transparent;
  box-shadow: none;
  transform-origin: center;
  transition: transform 0.08s linear;
}

.mfp-wrap {
  overflow: hidden !important;
}
</style>

<script>
$(function () {
  var scale = 1;

  function resetImageZoom() {
    scale = 1;
    $(".mfp-img").css("transform", "");
  }

  // 为头像和论文图片链接启用预览。
  $(".author__avatar a, .paper-box-image a")
    .filter(function () {
      return $(this).find("img").length > 0;
    })
    .addClass("image-popup");

  $(".image-popup").magnificPopup({
    type: "image",
    closeOnContentClick: false,
    closeOnBgClick: true,
    enableEscapeKey: true,
    gallery: {
      enabled: true,
      navigateByImgClick: false,
      preload: [0, 1]
    },
    callbacks: {
      open: resetImageZoom,
      change: resetImageZoom,
      close: resetImageZoom
    }
  });

  // 阻止单击大图时切换图片或关闭弹窗。
  document.addEventListener("click", function (event) {
    if (!event.target.closest(".mfp-img")) return;

    event.preventDefault();
    event.stopImmediatePropagation();
  }, true);

  // 滚轮缩放，范围为初始尺寸的 0.5～6 倍。
  document.addEventListener("wheel", function (event) {
    var image = event.target.closest(".mfp-img");
    if (!image) return;

    event.preventDefault();

    scale *= Math.exp(-event.deltaY * 0.0015);
    scale = Math.max(0.5, Math.min(6, scale));

    image.style.transform = "scale(" + scale + ")";
  }, { passive: false });

  // 双击恢复初始比例。
  $(document).on("dblclick", ".mfp-img", function (event) {
    event.preventDefault();
    event.stopPropagation();
    resetImageZoom();
  });
});
</script>
