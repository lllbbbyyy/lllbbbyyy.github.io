<style>
.author__avatar a.image-popup,
.author__avatar a.image-popup img,
.paper-box-image a.image-popup,
.paper-box-image a.image-popup img {
  cursor: zoom-in !important;
}

/* 大图按浏览器窗口适配，并允许以中心为基准缩放。 */
.mfp-img {
  transform-origin: center;
  transition: transform 0.08s linear;
}

.mfp-wrap {
  overflow: hidden !important;
}
</style>

<script>
$(function () {
  var scale = 1;

  function resetImageZoom() {
    scale = 1;
    $(".mfp-img").css("transform", "");
  }

  // 图片切换或关闭时恢复缩放比例。
  $(document).on("mfpChange mfpClose", resetImageZoom);

  // 在弹窗中的图片上滚动鼠标滚轮进行缩放。
  document.addEventListener("wheel", function (event) {
    var image = event.target.closest(".mfp-img");
    if (!image) return;

    event.preventDefault();

    scale *= Math.exp(-event.deltaY * 0.0015);
    scale = Math.max(0.5, Math.min(6, scale));

    image.style.transform = "scale(" + scale + ")";
  }, { passive: false });

  // 双击大图恢复原始显示比例。
  $(document).on("dblclick", ".mfp-img", function (event) {
    event.preventDefault();
    resetImageZoom();
  });
});
</script>
